<title>Rasta's Peri Q Chesanyama</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&amp;family=Oswald:wght@200..700&amp;family=Public+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "peri-red": "#C8240B",
            "chesa-orange": "#F07820",
            "smoke-charcoal": "#1A1A1A",
            "smoke-dark": "#0D0D0D",
            "ash-grey": "#4A4A4A",
            "cream-white": "#FFF8F5",
            "warm-white": "#F5F5F5",
            "muted-grey": "#A1A1A1"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "md": "0.375rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Oswald", "sans-serif"],
            "display": ["Oswald", "sans-serif"],
            "body": ["Nunito Sans", "sans-serif"],
            "label": ["Nunito Sans", "sans-serif"]
          },
          animation: {
            'fill-bar': 'fillBar 2s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 3s ease-in-out infinite'
          },
          keyframes: {
            fillBar: {
              '0%': { width: '0%', opacity: '0.8' },
              '50%': { width: '100%', opacity: '1' },
              '100%': { width: '100%', opacity: '0', transform: 'translateX(100%)' }
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.5' },
              '50%': { opacity: '0.8' }
            }
          }
        }
      }
    }
  </script>
<style>
    /* Specific CSS to enforce the dimensions and center content if viewed on desktop */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #000;
      margin: 0;
    }

    .mobile-container {
      width: 390px;
      height: 844px;
      position: relative;
      overflow: hidden;
      /* Background setup with gradients */
      background: linear-gradient(180deg, #1A1A1A 0%, #0D0D0D 100%);
    }

    /* Radial glow for the bottom */
    .glow-overlay {
      position: absolute;
      bottom: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(200, 36, 11, 0.4) 0%, rgba(240, 120, 32, 0.2) 30%, rgba(13, 13, 13, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* Smoke texture overlay */
    .smoke-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.15;
      background-image: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.8"/></svg>');
      pointer-events: none;
      z-index: 2;
    }

    .content-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .bottom-wrapper {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 24px; /* Space above loading bar */
    }
  </style>
</head>

<div class="smoke-overlay"></div>
<div class="glow-overlay animate-pulse-glow"></div>
<!-- Main Content -->
<div class="content-wrapper px-8">
