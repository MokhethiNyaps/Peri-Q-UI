<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Chicken Kota - Rasta's Peri Q Chesanyama</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#C8240B',
                            orange: '#F07820',
                            charcoal: '#1A1A1A',
                            grey: '#4A4A4A',
                            cream: '#FFF8F5',
                            surface: '#FFFFFF',
                            muted: '#F5F0ED',
                            green: '#2A8C5A',
                            amber: '#E8A400',
                            blue: '#1A6AB1'
                        }
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Oswald", "sans-serif"],
                        "body": ["Nunito Sans", "sans-serif"],
                        "label": ["Nunito Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #E5E7EB;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-black/50 font-body antialiased flex flex-col justify-end min-h-screen">
<!-- Dimmed Background Overlay is achieved by body bg color and flex alignment -->
<!-- Bottom Sheet Modal -->
<main class="w-full max-w-[500px] mx-auto bg-brand-surface rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.12)] flex flex-col h-[85vh] overflow-hidden relative animate-[slideUp_0.3s_ease-out]">
<!-- Handle -->
<div class="w-full flex justify-center pt-3 pb-2 bg-brand-surface absolute top-0 z-10 rounded-t-3xl">
<div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto pb-[100px]">
<!-- Hero Image -->
<div class="w-full h-[200px] relative">
<img alt="Chicken Kota" class="w-full h-full object-cover rounded-t-3xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCmkCT0c-2oerCs2YYXkzwdZYXTNrz84az9jwpwQTyf7DleaC2OLXgYSIvtSVqiI3Ktt9OUYfhDqxyqFV8NfE78TeNq5dpnYQg40bgpHvMwZKxGFyeSHXn0sX_SA0jm6uYMyja6JEHQLa-s2V-EzF4S3OPFGeM89rUzLZ_8AhUVXv2DYqmxlfV7kKgFe6NP6mZ6BVPOXXui5gyjYp3PsS3Y1WYmbwSRdzzgHcVPCQrE4tr-HCwMO49vBKbNCOf6_GEdRawuzlhuqxcG"/>
<!-- Subtle Bottom Gradient -->
<div class="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-brand-surface to-transparent"></div>
<!-- Close Button over Image -->
<button class="absolute top-4 right-4 w-8 h-8 bg-black/40 backdrop-blur-sm rounded-full flex items-center justify-center text-white hover:bg-black/60 transition-colors z-20">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
<!-- Info Section -->
<section class="px-4 py-2 bg-brand-surface">
<div class="flex justify-between items-start mb-2">
<div>
<h1 class="font-headline text-[24px] font-bold text-brand-charcoal leading-tight">Chicken Kota</h1>
<div class="flex items-center mt-1 space-x-1.5">
<span class="w-2 h-2 rounded-full bg-brand-green"></span>
<span class="font-label text-xs font-semibold text-brand-green">Available</span>
</div>
</div>
<div class="text-right">
<span class="font-headline text-[26px] font-bold text-brand-red">R65</span>
</div>
</div>
<p class="font-body text-[14px] text-brand-grey leading-relaxed mt-3">
                    Crispy golden fried chicken, loaded with salted chips, a full Russian sausage, and your choice of sauce. A local favourite done right.
                </p>
</section>
<hr class="border-t border-brand-muted mx-4 my-2"/>
<!-- Customization Section -->
<section class="px-4 py-4 space-y-6">
<!-- Spice Level -->
<div>
<div class="flex justify-between items-center mb-4">
<h2 class="font-headline text-[16px] font-semibold text-brand-charcoal">Spice Level</h2>
<span class="bg-brand-muted text-brand-grey text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">Required</span>
</div>
<div class="space-y-3">
<label class="flex items-center justify-between cursor-pointer group">
<span class="font-body text-[14px] text-brand-charcoal group-hover:text-brand-red transition-colors">Mild</span>
<div class="relative flex items-center justify-center w-5 h-5 border-2 border-brand-red rounded-full">
<div class="w-2.5 h-2.5 bg-brand-red rounded-full"></div>
<input checked="" class="sr-only" name="spice" type="radio" value="mild"/>
</div>
</label>
<label class="flex items-center justify-between cursor-pointer group">
<span class="font-body text-[14px] text-brand-charcoal group-hover:text-brand-red transition-colors">Medium</span>
<div class="relative flex items-center justify-center w-5 h-5 border-2 border-gray-300 rounded-full group-hover:border-brand-red transition-colors">
<input class="sr-only" name="spice" type="radio" value="medium"/>
</div>
</label>
<label class="flex items-center justify-between cursor-pointer group">
<span class="font-body text-[14px] text-brand-charcoal group-hover:text-brand-red transition-colors">Hot</span>
<div class="relative flex items-center justify-center w-5 h-5 border-2 border-gray-300 rounded-full group-hover:border-brand-red transition-colors">
<input class="sr-only" name="spice" type="radio" value="hot"/>
</div>
</label>
<label class="flex items-center justify-between cursor-pointer group">
<span class="font-body text-[14px] text-brand-charcoal group-hover:text-brand-red transition-colors flex items-center gap-1">Extra Hot <span class="material-symbols-outlined text-[14px] text-brand-red" data-weight="fill">local_fire_department</span></span>
<div class="relative flex items-center justify-center w-5 h-5 border-2 border-gray-300 rounded-full group-hover:border-brand-red transition-colors">
<input class="sr-only" name="spice" type="radio" value="extra_hot"/>
</div>
</label>
</div>
</div>
<hr class="border-t border-brand-muted"/>
<!-- Add-ons -->
<div>
<div class="flex justify-between items-center mb-4">
<h2 class="font-headline text-[16px] font-semibold text-brand-charcoal">Add-ons</h2>
<span class="text-brand-grey text-xs font-body">Optional</span>
</div>
<div class="space-y-4">
<label class="flex items-center justify-between cursor-pointer group">
<div class="flex items-center gap-3">
<div class="w-5 h-5 border-2 border-brand-red bg-brand-red rounded flex items-center justify-center text-white">
<span class="material-symbols-outlined text-[14px] font-bold">check</span>
</div>
<span class="font-body text-[14px] text-brand-charcoal">Extra Sauce</span>
</div>
<span class="font-body text-[14px] text-brand-grey">+R5</span>
<input checked="" class="sr-only" name="addons" type="checkbox" value="extra_sauce"/>
</label>
<label class="flex items-center justify-between cursor-pointer group">
<div class="flex items-center gap-3">
<div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center group-hover:border-brand-red transition-colors">
</div>
<span class="font-body text-[14px] text-brand-charcoal">Extra Chips</span>
</div>
<span class="font-body text-[14px] text-brand-grey">+R10</span>
<input class="sr-only" name="addons" type="checkbox" value="extra_chips"/>
</label>
<label class="flex items-center justify-between cursor-pointer group">
<div class="flex items-center gap-3">
<div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center group-hover:border-brand-red transition-colors">
</div>
<span class="font-body text-[14px] text-brand-charcoal">Peri Peri Drizzle</span>
</div>
<span class="font-body text-[14px] text-brand-grey">+R8</span>
<input class="sr-only" name="addons" type="checkbox" value="peri_drizzle"/>
</label>
</div>
</div>
<hr class="border-t border-brand-muted"/>
<!-- Special Notes -->
<div>
<h2 class="font-headline text-[16px] font-semibold text-brand-charcoal mb-3">Special Instructions</h2>
<textarea class="w-full bg-brand-muted border border-transparent focus:border-brand-red focus:ring-0 rounded-lg p-3 font-body text-[13px] text-brand-charcoal placeholder-brand-grey/70 resize-none h-24 transition-colors" placeholder="Any special requests? (e.g. No onions, extra sauce)"></textarea>
</div>
</section>
</div>
<!-- Bottom Sticky Row -->
<div class="absolute bottom-0 w-full bg-brand-surface border-t border-brand-muted px-4 py-4 flex items-center justify-between z-20 pb-safe">
<!-- Quantity Controls -->
<div class="flex items-center bg-brand-muted rounded-full p-1 border border-brand-muted/50">
<button class="w-[44px] h-[44px] rounded-full flex items-center justify-center text-brand-charcoal hover:bg-white hover:shadow-sm transition-all active:scale-95 disabled:opacity-50" disabled="">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="font-headline font-semibold text-lg text-brand-charcoal w-6 text-center">1</span>
<button class="w-[44px] h-[44px] rounded-full flex items-center justify-center text-brand-charcoal hover:bg-white hover:shadow-sm transition-all active:scale-95">
<span class="material-symbols-outlined text-brand-red">add</span>
</button>
</div>
<!-- Add to Cart CTA -->
<button class="bg-brand-red text-white font-label font-semibold h-[48px] px-6 rounded-lg shadow-sm hover:opacity-90 active:scale-95 transition-all w-[160px] flex items-center justify-center gap-2">
<span>Add to Cart</span>
<span class="text-white/60 text-sm">•</span>
<span class="font-headline">R70</span> <!-- Updated to reflect base + selected addon -->
</button>
</div>
</main>
<style>
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        /* Safe area padding for modern mobile devices */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe {
                padding-bottom: calc(1rem + env(safe-area-inset-bottom));
            }
        }
    </style>
</body></html>
